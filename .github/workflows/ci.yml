name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets `deploy.yml` re-run this gate against the tagged commit, so a tag that
  # bypassed a pull request is still verified before it ships.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hexa
          POSTGRES_PASSWORD: hexa
          POSTGRES_DB: hexaconverter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hexa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hexa:hexa@localhost:5432/hexaconverter_test?schema=public
      # Referenced by `directUrl` in schema.prisma. Prisma fails validation
      # if it is unset, so it is required even for a direct connection.
      DIRECT_URL: postgresql://hexa:hexa@localhost:5432/hexaconverter_test?schema=public
      DOWNLOAD_URL_SECRET: ci-download-secret-value-long-enough-for-zod
      CRON_SECRET: ci-cron-secret-value
      STORAGE_DRIVER: local
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      DIRECT_URL: postgresql://build:build@localhost:5432/build
      DOWNLOAD_URL_SECRET: ci-download-secret-value-long-enough-for-zod
      CRON_SECRET: ci-cron-secret-value
      # The production build refuses the local storage driver.
      STORAGE_DRIVER: s3
      S3_BUCKET: ci
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hexa
          POSTGRES_PASSWORD: hexa
          POSTGRES_DB: hexaconverter_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hexa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hexa:hexa@localhost:5432/hexaconverter_e2e?schema=public
      DIRECT_URL: postgresql://hexa:hexa@localhost:5432/hexaconverter_e2e?schema=public
      DOWNLOAD_URL_SECRET: ci-download-secret-value-long-enough-for-zod
      CRON_SECRET: ci-cron-secret-value
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage
      # The e2e run is a single node with a working directory, so the local
      # driver is explicitly permitted.
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: 'true'
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
