# HexaConverter — Nginx reverse proxy
#
# Install:
#   sudo cp deploy/nginx/hexaconverter.conf /etc/nginx/sites-available/hexaconverter
#   sudo ln -s /etc/nginx/sites-available/hexaconverter /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates come from certbot:
#   sudo certbot --nginx -d hexaconverter.com -d www.hexaconverter.com
#
# Three settings here are not boilerplate and are the ones that break this
# application if copied from a generic template:
#
#   client_max_body_size   must be at least MAX_UPLOAD_BYTES, or large uploads
#                          die with a 413 that never reaches the app.
#   proxy_request_buffering off  streams the upload through instead of spooling
#                          the whole file to disk first. The route verifies
#                          magic bytes on the stream and enforces the size cap
#                          as it goes; buffering defeats both and doubles disk.
#   proxy_read_timeout     conversions are minutes, not seconds. The default 60s
#                          severs long encodes mid-flight.

# Redirect HTTP to HTTPS. Certbot's ACME challenge stays on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name hexaconverter.com www.hexaconverter.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The bare domain redirects to www, which is the canonical host.
#
# This MUST match `NEXT_PUBLIC_APP_URL`. If the app emits canonical URLs on one
# host while nginx redirects that host to the other, every canonical points at
# a 301 — search engines follow it, but it wastes crawl budget and muddies
# which origin owns the ranking. To flip to the bare domain instead, swap the
# two `server_name` values below and change `NEXT_PUBLIC_APP_URL` in the same
# commit.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hexaconverter.com;

    ssl_certificate     /etc/letsencrypt/live/hexaconverter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexaconverter.com/privkey.pem;

    return 301 https://www.hexaconverter.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hexaconverter.com;

    ssl_certificate     /etc/letsencrypt/live/hexaconverter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexaconverter.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Uploads -----------------------------------------------------------
    # Keep in step with MAX_UPLOAD_BYTES (default 512 MB). Nginx rejects before
    # the app ever sees the request, so a mismatch reads as a server fault.
    client_max_body_size 2048m;
    client_body_timeout  300s;

    # --- Security ----------------------------------------------------------
    # CSP, HSTS, X-Frame-Options and the rest are set by the application in
    # next.config.mjs. They are deliberately not duplicated here: two sources
    # for one header is how they drift.
    server_tokens off;

    # --- Compression -------------------------------------------------------
    # Next's own `compress: true` only does gzip. Brotli here is roughly 15-20%
    # better on text and is the main reason to terminate at Nginx at all.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml application/manifest+json;

    # Requires a brotli module — NOT in stock Nginx. Without it `nginx -t`
    # fails outright with `unknown directive "brotli"`; Nginx has no notion of
    # an optional directive. Either install one:
    #
    #     apt-get install libnginx-mod-brotli
    #
    # or comment out this whole block, continuation lines included:
    #
    #     sed -i '/^\s*brotli\s*on;/,/manifest+json;/ s/^/# /' this-file
    #
    # Commenting only the first line leaves `brotli_types`' wrapped arguments
    # behind, which fail the same way on the next line. gzip above covers the
    # same content types, so dropping brotli costs a little bandwidth and
    # nothing else.
    brotli            on;
    brotli_comp_level 5;
    brotli_types      text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml application/manifest+json;

    # --- Proxy defaults ----------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # The application reads the FIRST entry of this to rate-limit and to hash
    # into audit rows, so this header must contain the real peer address and
    # nothing a client chose.
    #
    # Deliberately $remote_addr and not $proxy_add_x_forwarded_for: the latter
    # expands to "$http_x_forwarded_for, $remote_addr", which keeps whatever the
    # client sent in front. A caller sending a rotating X-Forwarded-For would
    # then get a fresh rate-limit bucket on every request and poison the audit
    # trail. Overwriting is what makes the first entry trustworthy.
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Connection        '';

    # --- Immutable build assets --------------------------------------------
    # Content-hashed by the build, so they can be cached hard and served
    # without consulting the origin again.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        access_log off;
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        access_log off;
    }

    # --- Uploads and downloads ---------------------------------------------
    # Streamed in both directions. Buffering a 512 MB upload to disk before
    # forwarding it wastes the streaming validation the route performs, and
    # buffering a download delays the first byte for no gain.
    location ~ ^/api/(uploads|jobs/[^/]+/download) {
        proxy_pass http://127.0.0.1:3000;
        proxy_request_buffering  off;
        proxy_buffering          off;
        proxy_read_timeout       600s;
        proxy_send_timeout       600s;
        client_max_body_size     2048m;
    }

    # --- Everything else ---------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        # Conversions are queued rather than performed in the request, but the
        # toolkit endpoints still wait on multi-file work. 300s matches the
        # `maxDuration` the route handlers declare.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Cron endpoints ----------------------------------------------------
    # Bearer-authenticated, but there is no reason for them to be reachable
    # from the public internet at all when the scheduler runs on this host.
    location /api/cron/ {
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.0/8;   # add your scheduler's subnet
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 300s;
    }
}
