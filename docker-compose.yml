# Local production-parity stack: the application, PostgreSQL and a MinIO
# bucket standing in for S3. Start with `docker compose up --build`.

name: hexaconverter

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hexa
      POSTGRES_PASSWORD: hexa
      POSTGRES_DB: hexaconverter
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hexa -d hexaconverter']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hexaminio
      MINIO_ROOT_PASSWORD: hexaminio-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job that creates the bucket the application expects.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hexaminio hexaminio-secret &&
      mc mb --ignore-existing local/hexaconverter &&
      mc anonymous set none local/hexaconverter &&
      echo 'bucket ready'
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: HexaConverter
      DATABASE_URL: postgresql://hexa:hexa@postgres:5432/hexaconverter?schema=public
      NEXTAUTH_URL: http://localhost:3000
      # Replace every secret below before exposing this stack to a network.
      NEXTAUTH_SECRET: local-development-secret-value-change-me-32
      DOWNLOAD_URL_SECRET: local-development-download-secret-change-me-32
      CRON_SECRET: local-development-cron-secret
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: hexaconverter
      S3_ACCESS_KEY_ID: hexaminio
      S3_SECRET_ACCESS_KEY: hexaminio-secret
      S3_FORCE_PATH_STYLE: 'true'
      MAX_UPLOAD_BYTES: '536870912'
      FILE_RETENTION_HOURS: '168'
      WORKER_CONCURRENCY: '2'
      WORKER_ENABLED: 'true'
    ports:
      - '3000:3000'
    command: >
      /bin/sh -c "
      ./node_modules/.bin/prisma migrate deploy &&
      node server.js
      "

volumes:
  postgres-data:
  minio-data:
